<style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf1f8,#e6ebf4);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink)}
.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:28px}.device{width:100%;max-width:430px;min-height: min(900px,calc(100vh - 56px));height:860px;max-height:calc(100vh - 56px);background:var(--bg);border:8px solid #1d2637;border-radius:38px;overflow:hidden;box-shadow:0 28px 80px #24395b35;position:relative;display:flex;flex-direction:column}
.status{height:28px;padding:7px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;background:var(--bg)}.top{padding:12px 20px 14px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;font-size:17px}.brand b{display:block;font-size:14px}.brand small{font-size:10px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#dce5ff;color:#3658bf;display:grid;place-items:center;font-weight:700}
main{flex:1;overflow:auto;padding:0 18px 88px;scrollbar-width:none}main::-webkit-scrollbar{display:none}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.h1{font-size:25px;line-height:1.25;letter-spacing:-.7px;margin:7px 0 5px;font-weight:800}.sub{font-size:12px;color:var(--muted);line-height:1.5}.hero{background:linear-gradient(135deg,#294b9c,#5278ed);color:white;border-radius:22px;padding:19px;margin:18px 0 16px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:#ffffff13;right:-35px;top:-45px}.hero .eyebrow{color:#d7e1ff}.hero h2{font-size:20px;line-height:1.35;margin:8px 0}.hero p{font-size:11px;color:#e0e8ff;max-width:245px;line-height:1.55}.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:12px 15px;font-size:12px;font-weight:700;cursor:pointer;min-height:42px}.btn.light{background:white;color:#3156bd}.btn.outline{background:white;color:var(--ink);border:1px solid var(--line)}.btn.full{width:100%}.btn.small{padding:8px 11px;min-height:34px;font-size:11px}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 1px 11px}.section b{font-size:14px}.section span{font-size:11px;color:var(--blue);font-weight:700;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:white;border:1px solid #edf0f5;border-radius:16px;padding:14px;box-shadow:0 5px 16px #20345b08}.stat .num{font-size:22px;font-weight:800;margin:7px 0 2px}.stat small,.muted{font-size:10px;color:var(--muted)}.pill{display:inline-flex;border-radius:30px;padding:5px 8px;background:#edf2ff;color:#3b5fc8;font-size:9px;font-weight:700}.pill.green{background:#e7f6ef;color:#12835e}.pill.amber{background:#fff4df;color:#a66b14}.project{display:flex;align-items:center;gap:12px}.projectIcon{width:42px;height:42px;border-radius:13px;background:#eaf0ff;display:grid;place-items:center;font-size:19px}.project b{font-size:12px}.project small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:6px;background:#edf0f5;border-radius:10px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--blue);border-radius:10px}.nav{height:72px;position:absolute;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px max(8px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8993a5;font-size:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;font-weight:600}.nav button .ico{font-size:18px;line-height:1}.nav button.active{color:var(--blue)}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5ef;border-radius:11px;background:white;padding:12px;font:inherit;font-size:12px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169e11a}.hint{font-size:10px;color:var(--muted);margin-top:5px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 10px;border:1px solid var(--line);border-radius:30px;background:white;font-size:10px;color:#596579;cursor:pointer}.chip.selected{background:#edf2ff;border-color:#cbd7ff;color:#3458c4}.shot{border-radius:16px;padding:13px;background:#eaf0ff;margin-bottom:10px}.shotThumb{height:170px;border-radius:13px;background:linear-gradient(160deg,#4269e1,#20345b);display:flex;flex-direction:column;align-items:center;padding:16px 13px;color:white;overflow:hidden}.shotThumb h3{text-align:center;font-size:16px;line-height:1.3;margin:4px 0 12px}.mockapp{background:white;border-radius:13px;width:75%;flex:1;padding:10px;color:#26334b;box-shadow:0 5px 18px #0b1b3c33}.mockapp .mini{height:7px;background:#e9edf5;border-radius:8px;margin:7px 0}.mockapp .mini.blue{background:#b9c9ff;width:70%}.shotMeta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.shotMeta b{font-size:11px}.preview{border-radius:20px;padding:18px 14px;background:#436be3;color:white;text-align:center;min-height:390px;display:flex;flex-direction:column;align-items:center}.preview h2{font-size:22px;line-height:1.25;margin:4px 0 18px}.preview .mockapp{width:86%;min-height:230px}.preview .mockapp .mini{height:9px;margin:12px 0}.notice{border-radius:12px;padding:12px;background:#fff5e4;color:#8d621b;font-size:10px;line-height:1.5;margin:12px 0}.checkline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}.checkline:last-child{border:0}.good{color:var(--green);font-weight:700}.warn{color:var(--amber);font-weight:700}.back{border:0;background:none;color:var(--blue);font-size:12px;font-weight:700;padding:0 0 12px;cursor:pointer}.hidden{display:none!important}.modalback{position:absolute;inset:0;background:#17243c66;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:100%;background:white;border-radius:20px;padding:20px;box-shadow:0 20px 50px #0003}.modal h3{margin:0 0 8px;font-size:17px}.modal p{font-size:11px;color:var(--muted);line-height:1.5}.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:#1e2b43;color:white;padding:10px 14px;border-radius:30px;font-size:10px;white-space:nowrap;z-index:8;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.twoBtns{display:flex;gap:8px}.twoBtns>*{flex:1}
@media(max-width:500px){body{background:var(--bg)}.stage{padding:0}.device{max-width:none;width:100%;height:100dvh;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}}
@media(min-width:501px) and (max-height:750px){.device{height:calc(100vh - 24px);max-height:none}}
</style></head><body><div class="stage"><div class="device">
<div class="status"><span>9:41</span><span>●●●  ▰</span></div>
<header class="top"><div class="brand"><div class="logo">S</div><div><b>StoreKit Studio</b><small>App Store Creative Workspace</small></div></div><div class="avatar">J</div></header>
<main id="main"></main>
<nav class="nav" id="nav">
<button data-tab="home" class="active"><span class="ico">⌂</span>홈</button>
<button data-tab="projects"><span class="ico">▣</span>프로젝트</button>
<button data-tab="shots"><span class="ico">▧</span>스크린샷</button>
<button data-tab="copy"><span class="ico">≡</span>스토어 문구</button>
<button data-tab="settings"><span class="ico">⚙</span>설정</button>
</nav><div class="toast" id="toast"></div>
<div class="modalback hidden" id="modal"><div class="modal"><h3 id="modalTitle">안내</h3><p id="modalText"></p><button class="btn full" onclick="closeModal()">확인</button></div></div>
</div></div>
<script>
const state={tab:"home",screen:0,headline:["영수증을 찍으면 끝","한눈에 보는 월별 지출","예산을 넘기기 전에 알려줘요"],bg:["#4169e1","#15966b","#e8753d"],appName:"예시 가계부",subtitle:"쉽고 빠른 지출 기록",features:"사진 한 장으로 영수증 입력\n월별 지출 그래프\n예산 초과 알림",keywords:"가계부, 지출, 예산, 영수증, 절약",store:"appstore"};
const main=document.getElementById("main");
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1900)}
function modal(t,m){document.getElementById("modalTitle").textContent=t;document.getElementById("modalText").textContent=m;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function setTab(t){state.tab=t;render()}
function section(a,b=""){return `<div class="section"><b>${a}</b><span onclick="toast('${b||"준비 중인 메뉴입니다"}')">${b?"전체 보기":""}</span></div>`}
function projectCard(){return `<div class="card" onclick="setTab('projects')" style="cursor:pointer"><div class="project"><div class="projectIcon">₩</div><div style="flex:1"><b>예시 가계부</b><small>마지막 수정 · 방금 전</small></div><span class="pill green">작업 중</span></div><div class="progress"><i style="width:68%"></i></div><div class="row muted" style="margin-top:7px"><span>제작 진행률</span><b>68%</b></div></div>`}
function home(){return `<div class="eyebrow">YOUR CREATIVE WORKSPACE</div><div class="h1">스토어에서 돋보이는<br>첫인상을 만드세요.</div><div class="sub">앱 스크린샷과 스토어 문구를 한곳에서 준비하세요.</div><div class="hero"><div class="eyebrow">PROJECT WORKFLOW</div><h2>앱의 가치를<br>한눈에 전달하기</h2><p>화면 이미지와 핵심 메시지를 조합해 스토어 등록용 소재를 준비합니다.</p><button class="btn light" onclick="setTab('projects')">프로젝트 열기 →</button></div><div class="grid2"><div class="stat"><span class="muted">프로젝트</span><div class="num">01</div><small>진행 중인 작업</small></div><div class="stat"><span class="muted">스크린샷 시안</span><div class="num">03</div><small>3개 메시지 구성</small></div></div>${section("최근 프로젝트","모두 보기")}${projectCard()}${section("빠른 작업")}<div class="grid2"><button class="btn outline" onclick="setTab('shots')">▧ 샷 편집하기</button><button class="btn outline" onclick="setTab('copy')">≡ 문구 검수하기</button></div><div class="notice">이 화면은 모바일 컨셉 프로토타입입니다. 실제 이미지 생성은 저장소의 Python CLI에서 수행합니다.</div>`}
function projects(){return `<button class="back" onclick="setTab('home')">← 홈</button><div class="eyebrow">WORKSPACE</div><div class="h1">프로젝트</div><div class="sub">앱별 스토어 소재를 관리합니다.</div><div class="row" style="margin:18px 0 12px"><span class="pill">전체 1개</span><button class="btn small" onclick="modal('새 프로젝트','프로젝트 생성 화면은 컨셉 범위입니다. 아래 앱 정보 편집 폼에서 예시 프로젝트를 수정할 수 있습니다.')">＋ 새 프로젝트</button></div>${projectCard()}<div class="section"><b>프로젝트 정보</b><span onclick="editProject()">편집</span></div><div class="card"><div class="field"><label>앱 이름</label><input id="appName" value="${esc(state.appName)}"></div><div class="field"><label>부제</label><input id="subtitle" value="${esc(state.subtitle)}"></div><div class="field"><label>주요 기능 (줄바꿈으로 구분)</label><textarea id="features">${esc(state.features)}</textarea></div><div class="field"><label>키워드 (쉼표로 구분)</label><input id="keywords" value="${esc(state.keywords)}"></div><button class="btn full" onclick="saveProject()">변경사항 저장</button></div>`}
function shots(){return `<div class="eyebrow">CREATIVE ASSETS</div><div class="h1">스크린샷</div><div class="sub">핵심 기능을 짧은 메시지로 전달하는 화면을 구성합니다.</div><div class="section"><b>출력 플랫폼</b><span onclick="modal('규격 안내','저장소 기준 참고 규격입니다. App Store 및 Google Play 공식 최신 요구사항을 제출 전에 확인하세요.')">규격 안내</span></div><div class="chips"><button class="chip selected" onclick="selectChip(this)">iOS 6.7"</button><button class="chip" onclick="selectChip(this)">iOS 6.5"</button><button class="chip" onclick="selectChip(this)">Google Play</button></div><div class="section"><b>메시지 카드 3개</b><span onclick="toast('샷 추가는 실제 구현 범위 밖입니다')">＋ 추가</span></div>${state.headline.map((h,i)=>`<div class="shot"><div class="shotThumb" style="background:${state.bg[i]}"><h3>${esc(h)}</h3><div class="mockapp"><b style="font-size:10px">이번 달 지출</b><div style="font-size:20px;font-weight:800;margin:8px 0">₩ 1,240,000</div><div class="mini blue"></div><div class="mini"></div><div class="mini" style="width:80%"></div></div></div><div class="shotMeta"><b>스크린샷 0${i+1}</b><button class="btn small" onclick="editShot(${i})">편집</button></div></div>`).join("")}<button class="btn full" onclick="setTab('copy')">스토어 문구 검수로 이동 →</button>`}
function editShot(i){state.screen=i;renderEditor()}
function renderEditor(){main.innerHTML=`<button class="back" onclick="setTab('shots')">← 스크린샷 목록</button><div class="eyebrow">SCREEN ${state.screen+1} / 3</div><div class="h1">스크린샷 편집</div><div class="field"><label>헤드라인 문구</label><textarea id="headline">${esc(state.headline[state.screen])}</textarea><div class="hint">짧고 구체적인 핵심 효익을 권장합니다.</div></div><div class="field"><label>배경색 HEX</label><input id="bg" value="${state.bg[state.screen]}" oninput="livePreview()"></div><div class="preview" id="live"><h2>${esc(state.headline[state.screen])}</h2><div class="mockapp"><b>이번 달 지출</b><div style="font-size:25px;font-weight:800;margin:14px 0">₩ 1,240,000</div><div class="mini blue"></div><div class="mini"></div><div class="mini" style="width:80%"></div><div class="mini blue" style="width:55%"></div></div><small style="margin-top:12px;opacity:.8">미리보기 · 실제 생성 이미지가 아닙니다</small></div><div class="twoBtns" style="margin-top:14px"><button class="btn outline" onclick="setTab('shots')">취소</button><button class="btn" onclick="saveShot()">저장</button></div>`}
function livePreview(){let h=document.getElementById("headline").value,b=document.getElementById("bg").value;let p=document.getElementById("live");p.querySelector("h2").textContent=h;p.style.background=/^#[0-9a-f]{6}$/i.test(b)?b:"#4169e1"}
function saveShot(){let i=state.screen;state.headline[i]=document.getElementById("headline").value;let b=document.getElementById("bg").value;if(/^#[0-9a-f]{6}$/i.test(b))state.bg[i]=b;toast("스크린샷 설정을 화면 상태에 저장했습니다");setTab("shots")}
function copy(){let app=state.store==="appstore";return `<div class="eyebrow">STORE LISTING</div><div class="h1">스토어 문구</div><div class="sub">플랫폼별 등록 문구 초안을 확인하고 제한 사항을 점검합니다.</div><div class="chips" style="margin:16px 0"><button class="chip ${app?"selected":""}" onclick="state.store='appstore';render()">App Store</button><button class="chip ${!app?"selected":""}" onclick="state.store='play';render()">Google Play</button></div><div class="card"><div class="field"><label>앱 이름 · ${app?"최대 30자(저장소 참고값)":"최대 30자(저장소 참고값)"}</label><input value="${esc(state.appName)}" readonly></div><div class="field"><label>${app?"부제":"짧은 설명"}</label><textarea readonly>${esc(state.subtitle+" — "+state.features.split("\n").slice(0,2).join(", "))}</textarea></div><div class="field"><label>키워드</label><textarea readonly>${esc(state.keywords)}</textarea></div><div class="field"><label>상세 설명 미리보기</label><textarea readonly>${esc(state.appName+"은(는) "+state.subtitle+"를 돕는 앱입니다.\n\n주요 기능\n"+state.features.split("\n").map(x=>"• "+x).join("\n"))}</textarea></div><button class="btn full" onclick="validateCopy()">문구 검수 실행</button></div><div class="notice">문구는 저장소의 템플릿 규칙을 참고한 컨셉 미리보기입니다. 실제 CLI 결과와 동일한 API 호출을 수행하지 않습니다.</div><div id="checks"></div>`}
function validateCopy(){let f=state.features.split("\n").filter(Boolean),kw=state.keywords.split(",").map(x=>x.trim()).filter(Boolean),dup=kw.length-new Set(kw.map(x=>x.toLowerCase())).size;let risky=["1위","최고의","100% 무료","공식 인증","No.1","#1","best","무조건","완벽한"].filter(x=>(state.appName+" "+state.subtitle+" "+f.join(" ")).toLowerCase().includes(x.toLowerCase()));document.getElementById("checks").innerHTML=`<div class="card" style="margin-top:14px"><b style="font-size:13px">검수 결과</b><div class="checkline"><span>필수 앱 정보</span><b class="${state.appName&&state.subtitle&&f.length?'good':'warn'}">${state.appName&&state.subtitle&&f.length?'정상':'확인 필요'}</b></div><div class="checkline"><span>키워드 중복</span><b class="${dup?'warn':'good'}">${dup?dup+'건 중복':'중복 없음'}</b></div><div class="checkline"><span>과장 표현</span><b class="${risky.length?'warn':'good'}">${risky.length?risky.join(', '):'감지 없음'}</b></div><div class="checkline"><span>스크린샷 수</span><b class="good">3장 · 샘플 기준</b></div></div>`}
function settings(){return `<div class="eyebrow">PREFERENCES</div><div class="h1">설정</div><div class="sub">출력 환경과 정책 유의사항을 확인합니다.</div><div class="card" style="margin-top:18px"><div class="row"><b style="font-size:12px">이미지 출력 규격</b><span class="pill">참고값</span></div><div class="checkline"><span>iOS 6.7"</span><b>1290 × 2796</b></div><div class="checkline"><span>iOS 6.5"</span><b>1242 × 2688</b></div><div class="checkline"><span>iOS 5.5"</span><b>1242 × 2208</b></div><div class="checkline"><span>Google Play 휴대전화</span><b>1080 × 1920</b></div></div><div class="card" style="margin-top:12px"><b style="font-size:12px">글꼴 설정</b><p class="muted">한글 렌더링을 위해 Noto Sans CJK 등 한글 지원 TTF/TTC 글꼴을 지정하세요.</p><button class="btn outline full" onclick="modal('글꼴 안내','기존 CLI는 --font 옵션으로 글꼴 파일을 지정할 수 있습니다. 이 프로토타입은 글꼴 파일을 업로드하거나 실제 렌더링하지 않습니다.')">자세히 보기</button></div><div class="notice">스크린샷 픽셀 규격, 글자 수 제한, 장수는 저장소 코드에 정의된 참고값입니다. 스토어 정책은 변경될 수 있으므로 실제 제출 전에 Apple 및 Google의 공식 가이드를 확인하세요.</div><div class="card"><b style="font-size:12px">프로젝트 정보</b><p class="muted">PRJ-0028 · 모바일 컨셉 프로토타입 v1.0</p><button class="btn outline full" onclick="exportJSON()">프로젝트 JSON 내보내기</button></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function editProject(){document.getElementById("appName").focus()}
function saveProject(){state.appName=document.getElementById("appName").value;state.subtitle=document.getElementById("subtitle").value;state.features=document.getElementById("features").value;state.keywords=document.getElementById("keywords").value;toast("프로젝트 입력값을 화면 상태에 저장했습니다");render()}
function selectChip(el){el.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function exportJSON(){let data={app_name:state.appName,subtitle:state.subtitle,language:"ko",features:state.features.split("\n").filter(Boolean),keywords:state.keywords.split(",").map(x=>x.trim()).filter(Boolean),screens:state.headline.map((h,i)=>({image:`shot${i+1}.png`,headline:h,bg:state.bg[i]}))};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="app.json";a.click();URL.revokeObjectURL(a.href);toast("JSON 파일 다운로드를 시작했습니다")}
function render(){main.innerHTML=({home,projects,shots,copy,settings})[state.tab]();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
render();
</script></body></html>
